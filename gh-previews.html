<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>contributions graph — layout previews</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #EEEAE0;
      --warm-white: #F7F4EE;
      --ink: #1A1714;
      --ink-soft: #4A433C;
      --ink-muted: #8A8078;
      --accent: #5C3D2E;
      --accent-warm: #A0522D;
      --border: #D4C4B4;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }
    .dark {
      --cream: #1C1814;
      --warm-white: #141210;
      --ink: #F0EBE3;
      --ink-soft: #C0B8AE;
      --ink-muted: #7A7268;
      --accent: #D4A882;
      --accent-warm: #C8784A;
      --border: #352A22;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--warm-white);
      color: var(--ink);
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100dvh;
    }
    button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }

    .nav {
      position: sticky; top: 0; align-self: start;
      height: 100dvh; overflow: auto;
      padding: 28px 18px 40px;
      border-right: 1px solid var(--border);
      background: var(--warm-white);
    }
    .nav h1 {
      font-size: 11px; letter-spacing: .22em; text-transform: lowercase;
      color: var(--ink-muted); font-weight: 700; margin-bottom: 6px;
    }
    .nav .sub {
      font-size: 12px; color: var(--ink-soft); line-height: 1.45; margin-bottom: 18px;
    }
    .nav a {
      display: block; padding: 7px 8px; border-radius: 2px;
      font-size: 12px; color: var(--ink-soft); line-height: 1.3; text-decoration: none;
    }
    .nav a:hover, .nav a.active { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
    .nav a.selected { color: var(--accent); font-weight: 600; }
    .nav a span { display: block; font-size: 10px; color: var(--ink-muted); margin-top: 2px; font-weight: 400; }
    .nav .tools { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
    .nav .tools button, .nav .tools a.btn {
      padding: 8px 10px; border: 1px solid var(--border); border-radius: 2px;
      font-size: 11px; letter-spacing: .06em; text-align: left; text-decoration: none; color: inherit;
    }
    .nav .tools button:hover, .nav .tools a.btn:hover { border-color: var(--accent); }

    .main { padding: 36px 48px 140px; min-width: 0; }

    .pick-bar {
      position: fixed; bottom: 0; left: 240px; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 14px 48px;
      background: color-mix(in srgb, var(--warm-white) 92%, transparent);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .pick-bar .label { font-size: 13px; color: var(--ink-soft); }
    .pick-bar .label strong { color: var(--ink); font-weight: 700; }
    .pick-bar .hint { font-size: 11px; color: var(--ink-muted); letter-spacing: .04em; }

    .variant {
      scroll-margin-top: 28px;
      padding: 36px 0 56px;
      border-bottom: 1px solid var(--border);
    }
    .variant:last-child { border-bottom: 0; }
    .variant-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 20px; margin-bottom: 22px; max-width: 960px;
    }
    .variant-head .copy { flex: 1; min-width: 0; }
    .variant-head .num {
      font-size: 11px; letter-spacing: .2em; text-transform: lowercase;
      color: var(--accent); font-weight: 700; margin-bottom: 6px;
    }
    .variant-head h2 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
    .variant-head p { font-size: 14px; color: var(--ink-soft); line-height: 1.55; max-width: 560px; }
    .select-btn {
      flex-shrink: 0; padding: 10px 16px; border-radius: 2px;
      border: 1px solid var(--border); font-size: 12px; font-weight: 600;
      letter-spacing: .04em; transition: background .15s, border-color .15s, color .15s;
    }
    .select-btn:hover { border-color: var(--accent); color: var(--accent); }
    .select-btn.is-selected {
      background: var(--accent); border-color: var(--accent); color: var(--warm-white);
    }

    /* ---- contact mock frame ---- */
    .frame {
      border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
      border-radius: 4px; overflow: hidden; max-width: 960px;
      transition: border-color .2s, box-shadow .2s;
    }
    .frame.picked {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .contact-mock {
      position: relative; min-height: 420px;
      background: var(--warm-white);
      padding: 48px 56px;
    }
    .contact-mock .poro-hint {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: .12em; text-transform: lowercase;
      color: color-mix(in srgb, var(--ink-muted) 60%, transparent);
      pointer-events: none;
    }
    .contact-inner {
      position: relative; z-index: 1;
      display: flex; flex-direction: row; align-items: center;
      justify-content: flex-start; gap: clamp(32px, 5vw, 72px);
      pointer-events: none;
    }
    .contact-copy {
      display: flex; flex-direction: column; align-items: flex-start;
      max-width: 380px; flex-shrink: 0;
    }
    .contact-mock h2 {
      font-size: clamp(24px, 3.5vw, 40px); font-weight: 900; letter-spacing: -.02em;
      line-height: 1.05; margin-bottom: 12px; white-space: nowrap;
    }
    .contact-sub {
      font-size: 11px; letter-spacing: .25em; text-transform: lowercase;
      color: var(--ink-muted); margin-bottom: 32px;
    }
    .contact-links { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }
    .contact-link {
      display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600;
      letter-spacing: .06em; text-transform: lowercase; color: var(--ink);
    }
    .contact-link .ic { color: var(--ink-muted); display: flex; }
    .contact-link .ic svg {
      width: 16px; height: 16px; stroke: currentColor; fill: none;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    }
    .contact-gh { pointer-events: auto; flex-shrink: 0; position: relative; }

    .gh-graph { display: flex; flex-direction: column; gap: 6px; }
    .gh-months {
      display: grid;
      grid-template-columns: repeat(var(--gh-cols, 18), var(--gh-cell, 11px));
      column-gap: var(--gh-gap, 3px); height: 14px;
    }
    .gh-months span {
      font-size: 9px; letter-spacing: .04em; color: var(--ink-muted); line-height: 14px;
    }
    .gh-cells {
      display: grid;
      grid-template-columns: repeat(var(--gh-cols, 18), var(--gh-cell, 11px));
      grid-auto-rows: var(--gh-cell, 11px);
      gap: var(--gh-gap, 3px);
    }
    .gh-cell {
      width: var(--gh-cell, 11px); height: var(--gh-cell, 11px); border-radius: 2px;
      background: color-mix(in srgb, var(--ink) 7%, var(--warm-white));
    }
    .gh-cell.empty { visibility: hidden; }
    .gh-cell[data-level="1"] { background: color-mix(in srgb, var(--accent) 28%, var(--warm-white)); }
    .gh-cell[data-level="2"] { background: color-mix(in srgb, var(--accent) 48%, var(--warm-white)); }
    .gh-cell[data-level="3"] { background: color-mix(in srgb, var(--accent) 68%, var(--warm-white)); }
    .gh-cell[data-level="4"] { background: var(--accent); }

    /* ---- layout variants ---- */
    .lay-current .contact-gh { align-self: center; margin-top: 80px; }
    .lay-centered .contact-inner { align-items: center; }
    .lay-centered .contact-gh { align-self: center; margin-top: 0; }

    .lay-below-links .contact-inner { flex-direction: column; align-items: flex-start; gap: 0; }
    .lay-below-links .contact-gh { margin-top: 28px; align-self: flex-start; }

    .lay-footer .contact-inner { flex-direction: column; align-items: flex-start; gap: 36px; }
    .lay-footer .contact-row { display: flex; gap: clamp(32px, 5vw, 72px); align-items: flex-start; width: 100%; }
    .lay-footer .contact-gh { align-self: flex-start; margin-top: 0; }

    .lay-compact .contact-gh { align-self: center; margin-top: 60px; }
    .lay-compact .gh-graph { --gh-cell: 9px; --gh-gap: 2px; }

    .lay-large .contact-gh { align-self: center; margin-top: 40px; }
    .lay-large .gh-graph { --gh-cell: 17px; --gh-gap: 4px; }

    .lay-top .contact-inner { align-items: flex-start; }
    .lay-top .contact-gh { align-self: flex-start; margin-top: 8px; }

    .lay-github-adj .contact-links { gap: 0; }
    .lay-github-adj .link-with-graph { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
    .lay-github-adj .contact-inner { align-items: flex-start; }
    .lay-github-adj .contact-gh { margin-left: 28px; }

    .lay-spread .contact-inner { justify-content: space-between; width: 100%; }
    .lay-spread .contact-gh { align-self: center; margin-top: 0; }

    .lay-stacked .contact-inner {
      flex-direction: column; align-items: center; text-align: center;
      justify-content: center; min-height: 320px;
    }
    .lay-stacked .contact-copy { align-items: center; max-width: none; }
    .lay-stacked .contact-gh { margin-top: 32px; }

    .lay-strip .contact-inner { flex-direction: column; align-items: flex-start; gap: 28px; }
    .lay-strip .contact-gh { width: 100%; }
    .lay-strip .gh-graph { --gh-cell: 8px; --gh-gap: 2px; width: 100%; overflow: hidden; }

    .lay-inline-sub .contact-sub { margin-bottom: 16px; }
    .lay-inline-sub .contact-inner { align-items: flex-start; }
    .lay-inline-sub .contact-copy { max-width: 420px; }
    .lay-inline-sub .gh-inline { margin-bottom: 24px; }
    .lay-inline-sub .contact-gh.side { align-self: flex-start; margin-top: 48px; }

    .lay-corner .contact-inner { min-height: 340px; align-items: stretch; }
    .lay-corner .contact-copy { align-self: center; }
    .lay-corner .contact-gh {
      position: absolute; right: 56px; bottom: 56px; margin: 0;
    }

    .lay-narrow-weeks .contact-gh { align-self: center; margin-top: 48px; }
    .lay-narrow-weeks .gh-graph { --gh-cols: 12; }

    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      .nav {
        position: relative; height: auto; border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .nav .links { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
      .main { padding: 24px 20px 120px; }
      .pick-bar { left: 0; padding: 14px 20px; flex-direction: column; align-items: flex-start; }
      .contact-mock { padding: 32px 24px; min-height: 360px; }
      .contact-mock h2 { white-space: normal; }
      .lay-corner .contact-gh { position: static; margin-top: 24px; }
      .lay-spread .contact-inner { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <aside class="nav">
    <h1>graph layouts</h1>
    <p class="sub">Twelve ways to place and size the contributions graph in contact. Click <strong>select</strong> on your favorite.</p>
    <div class="links" id="nav-links"></div>
    <div class="tools">
      <button type="button" id="theme-toggle">toggle dark</button>
      <a class="btn" href="index.html#contact">back to site</a>
    </div>
  </aside>

  <main class="main" id="main"></main>

  <div class="pick-bar" id="pick-bar">
    <div>
      <div class="label" id="pick-label">No layout selected yet.</div>
      <div class="hint">Your choice is saved — tell me the option number in chat.</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'gh-layout-choice';

    const icons = {
      resume: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
      email: '<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',
      linkedin: '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 10v7M7 7v.5M12 17v-4a2 2 0 014 0v4M12 10v7"/></svg>',
      github: '<svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>',
    };

    const linksHTML = (extra = '') => `
      <div class="contact-links">
        <span class="contact-link"><span class="ic">${icons.resume}</span><span>resume</span></span>
        <span class="contact-link"><span class="ic">${icons.email}</span><span>email</span></span>
        <span class="contact-link"><span class="ic">${icons.linkedin}</span><span>linkedin</span></span>
        ${extra || `<span class="contact-link"><span class="ic">${icons.github}</span><span>github</span></span>`}
      </div>`;

    function mockLevels(weeks) {
      const seed = [0,0,1,0,2,3,4,2,1,0,0,3,4,4,2,1,0,0,2,3,4,3,2,1,0,0,1,2,4,4,3,2,1,0,0,0,2,3,4,4,3,2,1,0,0,1,3,4,4,3,2,0,0,0,1,2,3,4,4,3,2,1,0,0,0,2,4,4,3,2,1,0,0,1,2,3,4,4,3,2,1,0,0,0,2,3,4,3,2,1,0,0,1,2,3,4,4,3,2,1,0,0,0,1,2,3,4,4,3,2,1,0,0,0,2,3,4,4,2,1,0];
      return seed.slice(0, weeks * 7);
    }

    function renderGraph(weeks = 18) {
      const levels = mockLevels(weeks);
      const pad = 2;
      const cells = Array.from({ length: pad }, () => null).concat(
        levels.map((level) => ({ level }))
      );
      while (cells.length % 7 !== 0) cells.push(null);
      const weekCount = cells.length / 7;
      const weeksArr = [];
      for (let i = 0; i < cells.length; i += 7) weeksArr.push(cells.slice(i, i + 7));

      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      let monthHtml = '';
      let last = -1;
      weeksArr.forEach((week, wi) => {
        const m = (wi + 3) % 12;
        monthHtml += `<span>${m !== last ? months[m] : ''}</span>`;
        last = m;
      });

      let gridHtml = '';
      for (let d = 0; d < 7; d++) {
        for (let w = 0; w < weeksArr.length; w++) {
          const cell = weeksArr[w][d];
          if (!cell) gridHtml += '<span class="gh-cell empty"></span>';
          else gridHtml += `<span class="gh-cell" data-level="${cell.level}"></span>`;
        }
      }

      return `<div class="gh-graph" style="--gh-cols:${weekCount}">
        <div class="gh-months">${monthHtml}</div>
        <div class="gh-cells">${gridHtml}</div>
      </div>`;
    }

    const graphSide = () => `<div class="contact-gh">${renderGraph()}</div>`;
    const graph12 = () => `<div class="contact-gh">${renderGraph(12)}</div>`;

    const variants = [
      {
        id: 'v0', num: '0', title: 'Current — offset companion',
        blurb: 'Graph sits to the right of the links, nudged down ~80px. What you have now after the cleanup pass.',
        layout: 'lay-current',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v1', num: '1', title: 'Vertically centered pair',
        blurb: 'Same side-by-side layout, but copy and graph share a true vertical center — no downward offset.',
        layout: 'lay-centered',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v2', num: '2', title: 'Below the links',
        blurb: 'Graph drops under the contact links in the left column. Reads as part of the copy block, not a separate widget.',
        layout: 'lay-below-links',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
              ${graphSide()}
            </div>
          </div>`,
      },
      {
        id: 'v3', num: '3', title: 'Section footer strip',
        blurb: 'Headline + links stay in a row; graph spans the full width underneath. More editorial, less “sidebar”.',
        layout: 'lay-footer',
        body: () => `
          <div class="contact-inner">
            <div class="contact-row">
              <div class="contact-copy">
                <h2>let's build something.</h2>
                <p class="contact-sub">get in touch</p>
                ${linksHTML()}
              </div>
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v4', num: '4', title: 'Compact whisper',
        blurb: 'Same companion position, but 9px cells and 2px gaps — barely there until you look closely.',
        layout: 'lay-compact',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v5', num: '5', title: 'Large visual anchor',
        blurb: '17px cells on the right — the graph becomes a bold counterweight to the headline.',
        layout: 'lay-large',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v6', num: '6', title: 'Top-aligned',
        blurb: 'Graph aligns with the headline top edge instead of floating mid-section. Cleaner horizontal rhythm.',
        layout: 'lay-top',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v7', num: '7', title: 'Nested under github',
        blurb: 'Graph lives directly below the github link, indented — ties activity visually to that destination.',
        layout: 'lay-github-adj',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              <div class="contact-links">
                <span class="contact-link"><span class="ic">${icons.resume}</span><span>resume</span></span>
                <span class="contact-link"><span class="ic">${icons.email}</span><span>email</span></span>
                <span class="contact-link"><span class="ic">${icons.linkedin}</span><span>linkedin</span></span>
                <div class="link-with-graph">
                  <span class="contact-link"><span class="ic">${icons.github}</span><span>github</span></span>
                  ${graphSide()}
                </div>
              </div>
            </div>
          </div>`,
      },
      {
        id: 'v8', num: '8', title: 'Spread to edges',
        blurb: 'Copy hugs the left, graph hugs the right — maximum separation, gallery-like balance.',
        layout: 'lay-spread',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v9', num: '9', title: 'Centered stack',
        blurb: 'Everything centered in a column — headline, links, then graph. Calm and symmetrical.',
        layout: 'lay-stacked',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v10', num: '10', title: 'Full-width micro strip',
        blurb: 'Tiny 8px cells spanning the content width below the copy — a quiet timeline, not a heatmap poster.',
        layout: 'lay-strip',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v11', num: '11', title: 'Bottom-right corner',
        blurb: 'Copy stays center-left; graph pins to the bottom-right of the section — leaves room for the poro.',
        layout: 'lay-corner',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graphSide()}
          </div>`,
      },
      {
        id: 'v12', num: '12', title: 'Shorter window (12 weeks)',
        blurb: 'Same companion layout but only ~3 months of data — smaller footprint, less visual noise.',
        layout: 'lay-narrow-weeks',
        body: () => `
          <div class="contact-inner">
            <div class="contact-copy">
              <h2>let's build something.</h2>
              <p class="contact-sub">get in touch</p>
              ${linksHTML()}
            </div>
            ${graph12()}
          </div>`,
      },
    ];

    const nav = document.getElementById('nav-links');
    const main = document.getElementById('main');
    const pickLabel = document.getElementById('pick-label');
    let selected = localStorage.getItem(STORAGE_KEY) || '';

    function updatePickUI() {
      const v = variants.find((x) => x.id === selected);
      pickLabel.innerHTML = v
        ? `Selected: <strong>option ${v.num} — ${v.title}</strong>`
        : 'No layout selected yet.';
      document.querySelectorAll('.select-btn').forEach((btn) => {
        btn.classList.toggle('is-selected', btn.dataset.id === selected);
        btn.textContent = btn.dataset.id === selected ? 'selected' : 'select';
      });
      document.querySelectorAll('.frame').forEach((f) => {
        f.classList.toggle('picked', f.dataset.id === selected);
      });
      nav.querySelectorAll('a').forEach((a) => {
        a.classList.toggle('selected', a.dataset.target === selected);
      });
    }

    function select(id) {
      selected = id;
      localStorage.setItem(STORAGE_KEY, id);
      updatePickUI();
    }

    variants.forEach((v) => {
      const a = document.createElement('a');
      a.href = `#${v.id}`;
      a.dataset.target = v.id;
      a.innerHTML = `${v.num}. ${v.title}<span>${v.blurb.slice(0, 52)}${v.blurb.length > 52 ? '…' : ''}</span>`;
      nav.appendChild(a);

      const section = document.createElement('section');
      section.className = 'variant';
      section.id = v.id;
      section.innerHTML = `
        <div class="variant-head">
          <div class="copy">
            <div class="num">option ${v.num}</div>
            <h2>${v.title}</h2>
            <p>${v.blurb}</p>
          </div>
          <button type="button" class="select-btn" data-id="${v.id}">select</button>
        </div>
        <div class="frame" data-id="${v.id}">
          <div class="contact-mock ${v.layout}">
            ${v.body()}
            <div class="poro-hint">poro lives here</div>
          </div>
        </div>`;
      main.appendChild(section);

      section.querySelector('.select-btn').addEventListener('click', () => select(v.id));
      section.querySelector('.frame').addEventListener('dblclick', () => select(v.id));
    });

    document.getElementById('theme-toggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    const links = [...nav.querySelectorAll('a')];
    const sections = variants.map((v) => document.getElementById(v.id));
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (!e.isIntersecting) return;
        links.forEach((l) => l.classList.toggle('active', l.dataset.target === e.target.id));
      });
    }, { rootMargin: '-30% 0px -55% 0px', threshold: 0 });
    sections.forEach((s) => io.observe(s));

    updatePickUI();
  </script>
</body>
</html>
