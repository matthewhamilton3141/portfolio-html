<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>photobook · matthew h</title>
  <meta name="description" content="photobook — moments, places, and people" />
  <link rel="icon" href="/icon.png?v=round" type="image/png" />
  <link rel="apple-touch-icon" href="/icon.png?v=round" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:ital,opsz,wght@0,9..40,300..900;1,9..40,300..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=gh-accent" />
</head>
<body class="photos-page">

  <header class="topbar">
    <a class="photos-back" href="/" id="photos-home">← home</a>
    <div class="topbar-icons">
      <button class="topbar-icon" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark mode">
        <svg id="theme-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="photobook">
    <div class="photobook-intro">
      <p class="photobook-path">/photos</p>
      <h1 class="photobook-title">photobook</h1>
      <p class="photobook-sub">loose prints from around. tap one to look closer.</p>
    </div>

    <div class="polaroid-board" id="polaroid-board" aria-label="Scattered polaroids"></div>
  </main>

  <div class="photo-lightbox" id="photo-lightbox" hidden>
    <button class="photo-lightbox-close" type="button" aria-label="Close">✕</button>
    <button class="photo-lightbox-nav prev" id="lightbox-prev" type="button" aria-label="Previous photo">‹</button>
    <button class="photo-lightbox-nav next" id="lightbox-next" type="button" aria-label="Next photo">›</button>
    <figure class="photo-lightbox-figure">
      <img id="lightbox-img" alt="" />
      <figcaption id="lightbox-cap"></figcaption>
    </figure>
  </div>

  <script>
    // Coming back home shouldn't replay the landing intro.
    sessionStorage.setItem('portfolio-intro-done', '1');
    document.getElementById('photos-home')?.addEventListener('click', () => {
      sessionStorage.setItem('portfolio-intro-done', '1');
    });

    (function () {
      const THEMES = [
        { id: 'zinc', className: 'theme-stark-mono' },
        { id: 'editorial', className: 'theme-warm-editorial' },
        { id: 'nordic', className: 'theme-cyber-nordic' },
        { id: 'mint', className: 'theme-midnight-mint' },
        { id: 'lavender', className: 'theme-lavender-dusk' },
        { id: 'rose', className: 'theme-cherry-blossom' },
      ];
      const root = document.documentElement;
      const saved = localStorage.getItem('portfolio-palette');
      const theme = THEMES.find((t) => t.id === saved) || THEMES[0];
      THEMES.forEach((t) => root.classList.remove(t.className));
      root.classList.add(theme.className);

      const btn = document.getElementById('theme-toggle');
      const icon = document.getElementById('theme-icon');
      const moon = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
      const sun = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
      let dark = localStorage.getItem('theme') === 'dark';
      if (localStorage.getItem('theme') !== 'dark' && localStorage.getItem('theme') !== 'light') {
        localStorage.setItem('theme', 'light');
        dark = false;
      }
      const apply = () => {
        root.classList.toggle('dark', dark);
        icon.innerHTML = dark ? sun : moon;
      };
      apply();
      btn.addEventListener('click', () => {
        dark = !dark;
        localStorage.setItem('theme', dark ? 'dark' : 'light');
        apply();
      });
    })();

    /* ---- polaroid board ------------------------------------------------ */
    (function () {
      // Edit captions anytime. size: sm | md | lg | xl
      // x/y are % of the board; keep captions clear of overlaps.
      const SHOTS = [
        {
          src: '/photos/web/IMG_9795.jpg',
          caption: 'touching grass',
          alt: 'Tall grass and a quiet pond under a blue sky',
          size: 'xl', x: 2, y: 1, rot: -5, z: 3,
        },
        {
          src: '/photos/web/pink-sky.jpg',
          caption: 'pink sky',
          alt: 'Pink sky',
          size: 'md', x: 42, y: 2, rot: 6, z: 2,
        },
        {
          src: '/photos/web/IMG_9404.jpg',
          caption: 'pse (e7) at night',
          alt: 'Looking down a dark atrium crossed by lit red staircases',
          size: 'md', x: 68, y: 0, rot: 8, z: 4,
        },
        {
          src: '/photos/web/cat.jpg',
          caption: 'cat',
          alt: 'Cat',
          size: 'sm', x: 36, y: 14, rot: -9, z: 6,
        },
        {
          src: '/photos/web/harbour.jpg',
          caption: 'harbour',
          alt: 'Harbour',
          size: 'lg', x: 58, y: 16, rot: -3, z: 5,
        },
        {
          src: '/photos/web/cool-tree.jpg',
          caption: 'cool tree',
          alt: 'Cool tree',
          size: 'md', x: 4, y: 28, rot: 4, z: 3,
        },
        {
          src: '/photos/web/daniel-caesar-fist-bump.jpg',
          caption: 'daniel caesar fist bump',
          alt: 'Fist bump with Daniel Caesar',
          size: 'sm', x: 38, y: 30, rot: 11, z: 7,
        },
        {
          src: '/photos/web/cursor-hackathon.jpg',
          caption: 'cursor hackathon',
          alt: 'Cursor hackathon',
          size: 'xl', x: 52, y: 34, rot: -6, z: 4,
        },
        {
          src: '/photos/web/IMG_9704.jpg',
          caption: 'dawg',
          alt: 'Hand petting a golden retriever on asphalt',
          size: 'lg', x: 8, y: 46, rot: -4, z: 5,
        },
        {
          src: '/photos/web/i-love-rayquaza.jpg',
          caption: 'i love rayquaza',
          alt: 'Rayquaza',
          size: 'md', x: 42, y: 50, rot: 5, z: 6,
        },
        {
          src: '/photos/web/central.jpg',
          caption: 'central',
          alt: 'Central',
          size: 'sm', x: 72, y: 52, rot: -8, z: 3,
        },
        {
          src: '/photos/web/if-i-am-the-sky-you-are-the-sea.jpg',
          caption: 'if i am the sky you are the sea',
          alt: 'If I am the sky you are the sea',
          size: 'lg', x: 58, y: 62, rot: 3, z: 5,
        },
        {
          src: '/photos/web/IMG_9761.jpg',
          caption: 'forgot to tap off because of this',
          alt: 'GO Transit train at a platform at dusk',
          size: 'sm', x: 28, y: 64, rot: 10, z: 4,
        },
        {
          src: '/photos/web/danielcaesartookmyphone.jpg',
          caption: 'daniel caesar took my phone',
          alt: 'Daniel Caesar took my phone',
          size: 'md', x: 4, y: 68, rot: -7, z: 6,
        },
        {
          src: '/photos/web/how-does-this-even-happen.jpg',
          caption: 'how does this even happen',
          alt: 'How does this even happen',
          size: 'md', x: 36, y: 76, rot: -2, z: 3,
        },
        {
          src: '/photos/web/trees.jpg',
          caption: 'trees',
          alt: 'Trees',
          size: 'xl', x: 62, y: 78, rot: 5, z: 4,
        },
        {
          src: '/photos/web/getting-into-uw-cs-at-a-frisbee-tournament.jpg',
          caption: 'getting into uw cs at a frisbee tournament',
          alt: 'Getting into UW CS at a frisbee tournament',
          size: 'lg', x: 6, y: 86, rot: 6, z: 5,
        },
        {
          src: '/photos/web/IMG_9394.jpg',
          caption: 'first overnight at the loo',
          alt: 'Mirror selfie brushing teeth and flashing a peace sign',
          size: 'md', x: 48, y: 90, rot: -6, z: 7,
        },
      ];

      const board = document.getElementById('polaroid-board');
      const lightbox = document.getElementById('photo-lightbox');
      const lbImg = document.getElementById('lightbox-img');
      const lbCap = document.getElementById('lightbox-cap');
      const btnPrev = document.getElementById('lightbox-prev');
      const btnNext = document.getElementById('lightbox-next');
      let active = -1;
      let hoverBoost = null;

      const showShot = (i) => {
        active = (i + SHOTS.length) % SHOTS.length;
        const shot = SHOTS[active];
        lbImg.classList.remove('swap');
        void lbImg.offsetWidth;
        lbImg.src = shot.src;
        lbImg.alt = shot.alt || '';
        lbCap.textContent = shot.caption || '';
        lbImg.classList.add('swap');
      };

      const open = (i) => {
        showShot(i);
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(() => lightbox.classList.add('open'));
      };
      const close = () => {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
        active = -1;
        setTimeout(() => {
          if (!lightbox.classList.contains('open')) {
            lightbox.hidden = true;
            lbImg.removeAttribute('src');
          }
        }, 220);
      };
      const prev = () => { if (active >= 0) showShot(active - 1); };
      const next = () => { if (active >= 0) showShot(active + 1); };

      SHOTS.forEach((shot, i) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = `polaroid polaroid-${shot.size}`;
        el.style.setProperty('--x', shot.x + '%');
        el.style.setProperty('--y', shot.y + '%');
        el.style.setProperty('--rot', shot.rot + 'deg');
        el.style.setProperty('--z', String(shot.z ?? i + 1));
        el.style.setProperty('--delay', (80 + i * 70) + 'ms');
        el.setAttribute('aria-label', shot.caption || shot.alt || 'Open photo');
        el.innerHTML =
          `<span class="polaroid-frame">` +
            `<img src="${shot.src}" alt="" loading="lazy" decoding="async" />` +
          `</span>` +
          `<span class="polaroid-cap">${shot.caption || ''}</span>`;
        el.addEventListener('pointerenter', () => {
          if (hoverBoost && hoverBoost !== el) hoverBoost.classList.remove('lifted');
          hoverBoost = el;
          el.classList.add('lifted');
        });
        el.addEventListener('pointerleave', () => {
          el.classList.remove('lifted');
          if (hoverBoost === el) hoverBoost = null;
        });
        el.addEventListener('focus', () => el.classList.add('lifted'));
        el.addEventListener('blur', () => el.classList.remove('lifted'));
        el.addEventListener('click', () => open(i));
        board.appendChild(el);
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      });

      btnPrev.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
      btnNext.addEventListener('click', (e) => { e.stopPropagation(); next(); });
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox || e.target.classList.contains('photo-lightbox-close')) close();
      });
      document.addEventListener('keydown', (e) => {
        if (lightbox.hidden) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
      });

      // Prefetch neighbors when open for snappier arrows
      lbImg.addEventListener('load', () => {
        if (active < 0) return;
        [active - 1, active + 1].forEach((i) => {
          const img = new Image();
          img.src = SHOTS[(i + SHOTS.length) % SHOTS.length].src;
        });
      });
    })();
  </script>
</body>
</html>
