<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>photos · matthew h</title>
  <meta name="description" content="photos — moments, places, and people" />
  <link rel="icon" href="/icon.png?v=round" type="image/png" />
  <link rel="apple-touch-icon" href="/icon.png?v=round" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/dm-sans-latin.woff2" crossorigin />
  <link rel="stylesheet" href="/styles.css?v=namefill-photos" />
  <script>
    try {
      sessionStorage.setItem('portfolio-intro-done', '1');
      const p = localStorage.getItem('portfolio-palette');
      const map = {
        zinc: 'theme-stark-mono', editorial: 'theme-warm-editorial', nordic: 'theme-cyber-nordic',
        mint: 'theme-midnight-mint', lavender: 'theme-lavender-dusk', rose: 'theme-cherry-blossom',
      };
      document.documentElement.classList.add(map[p] || 'theme-stark-mono');
      if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
      else localStorage.setItem('theme', 'light');
    } catch (_) {}
  </script>
</head>
<body class="photos-page">

  <div class="notch-wrap">
    <div class="notch" id="notch">
      <div class="notch-compact">
        <div class="compact-info" id="compact-playing" style="display:none">
          <div class="notch-cover"><img id="compact-cover" alt="" /></div>
          <div class="marquee-box"><div class="track"><span class="compact-title" id="compact-title"></span></div></div>
        </div>
        <div class="viz" id="viz" style="display:none"></div>
        <div class="compact-idle" id="compact-idle">
          <div class="notch-cover"><img id="idle-cover" alt="" /></div>
        </div>
      </div>
      <div class="notch-expanded">
        <div class="notch-top">
          <div class="notch-left">
            <div class="notch-art">
              <div class="glow" id="art-glow"></div>
              <div class="art-inner"><img id="art-cover" alt="" /></div>
            </div>
            <div class="notch-meta">
              <div class="marquee-box"><div class="track"><span class="notch-track-title" id="track-title"></span></div></div>
              <div class="marquee-box"><div class="track"><span class="notch-track-artist" id="track-artist"></span></div></div>
            </div>
          </div>
          <div class="notch-controls">
            <button class="ctrl mute" id="btn-mute" aria-label="Mute"></button>
            <button class="ctrl" id="btn-prev" aria-label="Previous">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M12 5L4 12l8 7V5zm8 0l-8 7 8 7V5z"/></svg>
            </button>
            <button class="play" id="btn-play" aria-label="Play"></button>
            <button class="ctrl" id="btn-next" aria-label="Next">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M4 5l8 7-8 7V5zm8 0l8 7-8 7V5z"/></svg>
            </button>
          </div>
        </div>
        <div class="notch-progress">
          <span class="t" id="cur-time">0:00</span>
          <input type="range" id="seek" min="0" max="100" value="0" />
          <span class="t right" id="dur-time">0:00</span>
        </div>
      </div>
    </div>
  </div>

  <div class="palette-dock show" id="palette" aria-label="Color palette">
    <span class="palette-label">palette</span>
    <div class="palette-squares" id="palette-squares"></div>
  </div>

  <header class="topbar">
    <a class="photos-back" href="/" id="photos-home">back</a>
    <div class="topbar-icons">
      <button class="topbar-icon" id="theme-toggle" title="Toggle theme" aria-label="Toggle dark mode">
        <svg id="theme-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="photobook">
    <div class="photobook-intro">
      <p class="photobook-path">/photos</p>
      <h1 class="photobook-title">photos</h1>
      <p class="photobook-sub">from around. tap one to look closer.</p>
    </div>

    <div class="photo-roll" id="photo-roll" aria-label="Photo roll"></div>
  </main>

  <div class="photo-lightbox" id="photo-lightbox" hidden>
    <button class="photo-lightbox-close" type="button" aria-label="Close">✕</button>
    <button class="photo-lightbox-nav prev" id="lightbox-prev" type="button" aria-label="Previous photo">‹</button>
    <button class="photo-lightbox-nav next" id="lightbox-next" type="button" aria-label="Next photo">›</button>
    <figure class="photo-lightbox-figure">
      <img id="lightbox-img" alt="" />
      <figcaption id="lightbox-cap"></figcaption>
    </figure>
  </div>

  <script src="/script.js?v=namefill-photos"></script>
  <script src="/photos.js?v=photo-cache"></script>
</body>
</html>
